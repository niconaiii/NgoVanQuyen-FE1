<div class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md bg-white rounded-3xl border border-slate-200 p-8 shadow-xl">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-semibold text-slate-900">Đăng ký</h1>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="submitForm()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Tên người dùng</label>
        <input
          formControlName="username"
          type="text"
          class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          placeholder="Nhập tên người dùng"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Email</label>
        <input
          formControlName="email"
          type="email"
          class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          placeholder="Nhập email"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Mật khẩu</label>
        <input
          formControlName="password"
          type="password"
          class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          placeholder="Nhập mật khẩu"
        />
      </div>

      <button
        type="submit"
        class="w-full rounded-2xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-200"
      >
        Đăng ký
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Đã có tài khoản? <a href="/login" class="font-medium text-indigo-600 hover:text-indigo-700">Đăng nhập</a>
    </p>
  </div>
</div>
